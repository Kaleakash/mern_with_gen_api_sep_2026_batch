<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Object creation using Function style</h2>
    <script>
        function Employee() {
                document.write("<br/> Employee object created")
        }
        //Employee()
        let emp1 = new Employee()       // now it is consider as object 

        function Customer() {
            this.cid = 100          // property this keyword. 
            this.cname = "Raj"
            this.age = 21
            // let city="Bangalore"        // local property 
            // state:"Kar"
        }
        let cust1 = new Customer();
        document.write("<br/> Customer details")
        document.write("<br/> Customer Id is "+cust1.cid)
        document.write("<br/> Customer Name is "+cust1.cname)
        document.write("<br/> Customer Age is "+cust1.age)
        //document.write("<br/> Customer City is "+cust1.city)
        //document.write("<br/> Customer City is "+cust1.state)

        function Product(pid,pname,price) {
            this.pid = pid
            this.pname = pname
            this.price = price
            this.displayProduct = function() {
                document.write("<br/> Product details")
                document.write("<br/> Product id "+this.pid)
                document.write("<br/> Product name "+this.pname)
                document.write("<br/> Product price "+this.price)
            }
        }
        let p1 = new Product(100,"TV",55000)
        p1.displayProduct()
        let p2 = new Product(101,"Computer",45000)
        p2.displayProduct()
    </script>
</body>
</html>
