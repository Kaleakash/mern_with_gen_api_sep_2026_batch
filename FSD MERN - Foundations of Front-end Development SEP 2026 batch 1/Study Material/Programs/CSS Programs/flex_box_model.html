<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="flex_box.css">
</head>

<body>

    <h1>Shopping Cart</h1>

    <div class="cart">

        <div class="cart-item">

            <div class="product-info">
                <h2>HP Laptop</h2>
                <p>Intel Core i5 | 16GB RAM | 512GB SSD</p>
            </div>

            <div class="price">
                $5,999
            </div>

            <div class="quantity">
                Qty: 1
            </div>

            <button>Remove</button>

        </div>


        <div class="cart-item">

            <div class="product-info">
                <h2>Wireless Mouse</h2>
                <p>Bluetooth Wireless Mouse</p>
            </div>

            <div class="price">
                $129.99
            </div>

            <div class="quantity">
                Qty: 2
            </div>

            <button>Remove</button>

        </div>


        <div class="cart-item">

            <div class="product-info">
                <h2>Keyboard</h2>
                <p>Wireless Mechanical Keyboard</p>
            </div>

            <div class="price">
                $249.99
            </div>

            <div class="quantity">
                Qty: 1
            </div>

            <button>Remove</button>

        </div>

    </div>

</body>
</html>
