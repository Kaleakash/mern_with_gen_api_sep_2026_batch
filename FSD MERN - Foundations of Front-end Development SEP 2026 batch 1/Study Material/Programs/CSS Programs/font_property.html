<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .employee-name-font-property {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 24px;
            font-weight: 700;
            font-style: italic;
        }
        .employee-name-color-property{
            color: red;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div>
        <h2>CSS Font Property example</h2>
        <p>Akash is a Java and Spring Boot trainer.</p>
        <hr>
        <p class="employee-name-font-property employee-name-color-property">Akash is a Java and Spring Boot trainer.</p>
        
    </div>
</body>
</html>
