<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let choice = prompt("Add,Sub,Mul,Div - > Enter your choice");
        let a,b,result
        switch(choice){
            case "Add":
                    alert("Welcome to Addition block")
                    a = eval(prompt("Enter the value of a"))
                    b = eval(prompt("Enter the value of b"))
                    result = a+b;
                    alert("Sum of two number is "+result)
                    break;
            
            default: alert("Wrong choice")
        }
    </script>
</body>
</html>
