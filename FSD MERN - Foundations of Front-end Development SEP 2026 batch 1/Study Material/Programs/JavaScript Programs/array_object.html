<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Array Object Operation</h2>
    <script>
        let a;  // it can hold only one value
        let b=100; 
        document.write("Value of a is "+a)
        document.write("<br/>Value of b is "+b)
        // creating array object using literal style 

        let num1 = [];      // it can hold more than one value of any types. 
        let num2 = [100,200,300,400,500,600]
        document.write("<br/>Value of num1 is "+num1)
        document.write("<br/>Value of num2 is "+num2) // display data in string format separated by , 
        document.write("<br/> Access particular value using index "+num2[0]) // 100
        document.write("<br/> Access particular value using index "+num2[1]) // 200 
        document.write("<br/> Access particular value using index "+num2[5])    // 600 
        document.write("<br/> Size of num1 array "+num1.length); // 0, length pre defined property of array object. 
        document.write("<br/> Size of num2 array "+num2.length) // 6 
        num2.push(700);     // it add at last       tail 
        num2.push(800);     // it add at last       tail 
        num2.unshift(1000)  // it add at the start position head  
        num2.unshift(2000)  // it add at the start position head  
        document.write("<br/>Value of num2 is "+num2)
        num2.pop();     // remove from last 
        num2.shift()    // remove from starting position 
        document.write("<br/>Value of num2 is "+num2)
        document.write("<br/> Size of num2 array "+num2.length)
        num2.push(1,2,3,4);
        document.write("<br/>Value of num2 is "+num2)
        document.write("<br/> Size of num2 array "+num2.length)
    </script>
</body>
</html>
