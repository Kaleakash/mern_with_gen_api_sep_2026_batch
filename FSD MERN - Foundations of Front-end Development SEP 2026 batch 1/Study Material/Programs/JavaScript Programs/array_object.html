<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Array Object Operation</h2>
    <script>
        let a;  // it can hold only one value
        let b=100; 
        document.write("Value of a is "+a)
        document.write("<br/>Value of b is "+b)
        // creating array object using literal style 

        let num1 = [];      // it can hold more than one value of any types. 
        let num2 = [100,200,300,400,500,600]
        document.write("<br/>Value of num1 is "+num1)
        document.write("<br/>Value of num2 is "+num2)
        document.write("<br/> Access particular value using index "+num2[0])
        document.write("<br/> Access particular value using index "+num2[1])
        document.write("<br/> Access particular value using index "+num2[5])
        document.write("<br/> Size of num1 array "+num1.length); // length pre defined property of array object. 
        document.write("<br/> Size of num2 array "+num2.length)
        
    </script>
</body>
</html>
