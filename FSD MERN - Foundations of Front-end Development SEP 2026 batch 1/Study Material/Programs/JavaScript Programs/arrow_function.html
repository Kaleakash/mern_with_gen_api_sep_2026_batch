        // find largest of two number using expression 
        let findLargest1 = function(a,b){
            if(a>b){
                return "a is largest"
            }else {
                return "b is largest"
            }
        }
        let result2 = findLargest1(10,20)
        // find largest of two number using arrow 
        let findLargest2 = (a,b)=>{
            if(a>b){
                return "a is largest"
            }else {
                return "b is largest"
            }
        }
        let result3 = findLargest2(10,20)
        document.write("<br/> Largest of two number using expression style "+result2)
        document.write("<br/> Largest of two number using arrow style "+result3)
