<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="checkLoginDetails.js" defer></script>
</head>
<body>
    <h2>Login Form</h2>
    <form action="foodMenuDashboard.html" onsubmit="return checkLoginDetails()">
        <label>EmailId</label>
        <input type="email" id="emailId" required/><br/>
        <label>Password</label>
        <input type="password" id="password" required/><br/>
        <input type="submit" value="Login" id="loginBtn"/>
        <input type="reset" value="reset" id="registerBtn"/>
    </form>
</body>
</html>
